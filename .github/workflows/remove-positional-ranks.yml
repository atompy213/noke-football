name: Remove Positional Ranks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-ranks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove positional rank displays
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          # Find the function even if its whitespace/line breaks differ.
          match = re.search(r'function\s+getPositionalRank\s*\(', text)
          if not match:
              raise SystemExit("Could not find getPositionalRank function")

          brace = text.find("{", match.end())
          if brace == -1:
              raise SystemExit("Could not find getPositionalRank function body")

          # Find the matching closing brace for the function body.
          depth = 0
          quote = None
          escape = False
          end = None
          for i in range(brace, len(text)):
              ch = text[i]
              if quote:
                  if escape:
                      escape = False
                  elif ch == "\\":
                      escape = True
                  elif ch == quote:
                      quote = None
                  continue
              if ch in ('"', "'", "`"):
                  quote = ch
              elif ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise SystemExit("Could not parse getPositionalRank function body")

          replacement = text[match.start():brace] + '{\n  return "—";\n}'
          text = text[:match.start()] + replacement + text[end:]

          # Remove the Player Information rank field by finding its enclosing
          # template expression rather than relying on exact indentation.
          label = text.find('"Positional Rank"')
          if label == -1:
              raise SystemExit("Could not find Player Information rank field")

          start = text.rfind('${infoItem(', 0, label)
          if start == -1:
              raise SystemExit("Could not find start of Player Information rank field")

          close = text.find(')}', label)
          if close == -1:
              raise SystemExit("Could not find end of Player Information rank field")

          text = text[:start] + text[close + 2:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/remove-positional-ranks.yml
          git add index.html

          git diff --cached --quiet && exit 0
          git commit -m "Remove positional rank displays"
          git push
