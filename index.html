<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noke Football</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #101114;
        color: #f5f5f5;
    }

    header {
        background: #181a20;
        border-bottom: 1px solid #2c2f36;
        padding: 24px;
    }

    header h1 {
        margin: 0;
        font-size: 30px;
    }

    header p {
        margin: 6px 0 0;
        color: #999;
    }

    main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 25px;
    }

    .status {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        background: #1b1d23;
        border: 1px solid #30333b;
    }

    .loading {
        color: #bbb;
    }

    .error {
        background: #321b1b;
        border-color: #713232;
        color: #ffb4b4;
    }

    .success {
        background: #18291d;
        border-color: #315d3d;
        color: #b8e5c2;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
    }

    .card {
        background: #181a20;
        border: 1px solid #2c2f36;
        border-radius: 12px;
        padding: 20px;
    }

    .card h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: #999;
        font-weight: normal;
    }

    .card .value {
        font-size: 25px;
        font-weight: bold;
    }

    section {
        background: #181a20;
        border: 1px solid #2c2f36;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 25px;
    }

    section h2 {
        margin: 0;
        padding: 18px 20px;
        border-bottom: 1px solid #2c2f36;
        font-size: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid #292c32;
    }

    th {
        color: #999;
        font-size: 13px;
        text-transform: uppercase;
    }

    tr:last-child td {
        border-bottom: none;
    }

    .team-name {
        font-weight: bold;
    }

    .manager {
        color: #aaa;
        font-size: 14px;
    }

    .record {
        font-weight: bold;
    }

    .number {
        text-align: right;
    }

    @media (max-width: 600px) {
        main {
            padding: 15px;
        }

        th:nth-child(3),
        td:nth-child(3) {
            display: none;
        }

        header {
            padding: 20px 15px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>🏈 Noke Football</h1>
    <p>Live Sleeper League Dashboard</p>
</header>

<main>

    <div id="status" class="status loading">
        Connecting to Sleeper...
    </div>

    <div class="grid">
        <div class="card">
            <h3>League</h3>
            <div class="value" id="leagueName">—</div>
        </div>

        <div class="card">
            <h3>Season</h3>
            <div class="value" id="season">—</div>
        </div>

        <div class="card">
            <h3>Teams</h3>
            <div class="value" id="teamCount">—</div>
        </div>

        <div class="card">
            <h3>Scoring</h3>
            <div class="value" id="scoring">—</div>
        </div>
    </div>

    <section>
        <h2>Standings</h2>

        <table>
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Manager</th>
                    <th>Record</th>
                    <th class="number">Points</th>
                </tr>
            </thead>

            <tbody id="standings">
                <tr>
                    <td colspan="4" style="text-align:center;">
                        Loading...
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

</main>

<script>

const LEAGUE_ID = "1387224646096539648";
const USERNAME = "Atompski";

async function sleeper(path) {
    const response = await fetch(
        "https://api.sleeper.app/v1" + path
    );

    if (!response.ok) {
        throw new Error(
            "Sleeper API returned " +
            response.status +
            " for " +
            path
        );
    }

    return await response.json();
}

async function loadLeague() {

    const status = document.getElementById("status");

    try {

        /*
         * Get the three basic pieces of information
         * needed for the dashboard.
         */

        const [league, users, rosters] = await Promise.all([
            sleeper("/league/" + LEAGUE_ID),
            sleeper("/league/" + LEAGUE_ID + "/users"),
            sleeper("/league/" + LEAGUE_ID + "/rosters")
        ]);

        /*
         * League information
         */

        document.getElementById("leagueName").textContent =
            league.name || "Noke Football";

        document.getElementById("season").textContent =
            league.season || "—";

        document.getElementById("teamCount").textContent =
            rosters.length;

        /*
         * Sleeper scoring settings
         */

        const scoring =
            league.scoring_settings || {};

        if (scoring.rec === 0.5) {
            document.getElementById("scoring").textContent =
                "Half PPR";
        } else if (scoring.rec === 1) {
            document.getElementById("scoring").textContent =
                "PPR";
        } else if (scoring.rec === 0) {
            document.getElementById("scoring").textContent =
                "Standard";
        } else {
            document.getElementById("scoring").textContent =
                "Custom";
        }

        /*
         * Create a quick lookup of Sleeper users.
         */

        const userMap = {};

        users.forEach(user => {
            userMap[user.user_id] = user;
        });

        /*
         * Build standings.
         */

        const standings = document.getElementById("standings");

        standings.innerHTML = "";

        const sortedRosters = [...rosters].sort((a, b) => {

            const winsA = a.settings?.wins || 0;
            const winsB = b.settings?.wins || 0;

            if (winsB !== winsA) {
                return winsB - winsA;
            }

            const pointsA =
                a.settings?.fpts || 0;

            const pointsB =
                b.settings?.fpts || 0;

            return pointsB - pointsA;
        });

        sortedRosters.forEach(roster => {

            const user =
                userMap[roster.owner_id];

            const teamName =
                user?.metadata?.team_name ||
                user?.display_name ||
                "Team " + roster.roster_id;

            const manager =
                user?.display_name ||
                "Unknown";

            const wins =
                roster.settings?.wins || 0;

            const losses =
                roster.settings?.losses || 0;

            const ties =
                roster.settings?.ties || 0;

            const points =
                roster.settings?.fpts || 0;

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>
                    <div class="team-name">
                        ${escapeHTML(teamName)}
                    </div>
                </td>

                <td>
                    <div class="manager">
                        ${escapeHTML(manager)}
                    </div>
                </td>

                <td class="record">
                    ${wins}-${losses}${ties ? "-" + ties : ""}
                </td>

                <td class="number">
                    ${Number(points).toFixed(2)}
                </td>
            `;

            standings.appendChild(row);
        });

        /*
         * Success!
         */

        status.className = "status success";

        status.textContent =
            "✓ Connected to Sleeper successfully";

    } catch (error) {

        console.error(error);

        status.className = "status error";

        status.innerHTML =
            "<strong>Unable to connect to Sleeper.</strong><br><br>" +
            escapeHTML(error.message) +
            "<br><br>" +
            "If this message mentions CORS, Sleeper is blocking " +
            "direct browser requests. If that happens, we'll add " +
            "one very small GitHub-compatible proxy.";

    }
}

/*
 * Prevent Sleeper/team names from being interpreted as HTML.
 */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

loadLeague();

</script>

</body>
</html>
